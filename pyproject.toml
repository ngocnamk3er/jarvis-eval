[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-eval"
version = "0.1.0"
description = "Evaluation & benchmarking harness for the Jarvis agent"
requires-python = ">=3.11"
dependencies = [
    "httpx==0.28.1",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.10.1",
    "python-dotenv==1.0.1",
    "rich>=13.9.0",
    "pyarrow>=17.0.0",
]

[project.scripts]
jeval = "jarvis_eval.cli:main"

[tool.setuptools]
packages = ["jarvis_eval", "jarvis_eval.clients", "jarvis_eval.benchmarks"]
