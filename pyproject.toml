[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-eval"
version = "0.1.0"
description = "Evaluation & benchmarking harness for the Jarvis agent"
requires-python = ">=3.11"
dependencies = [
    "httpx==0.28.1",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.10.1",
    "python-dotenv==1.0.1",
    "rich>=13.9.0",
    "pyarrow>=17.0.0",
    "numpy>=2.1.0",
]

[project.optional-dependencies]
# Groundedness metrics. Optional because a retrieval-only run doesn't need
# them, and this pulls in ~50 packages. langchain-community is pinned: at
# 0.4.x it dropped a module ragas still imports at module scope, so latest +
# latest fails on `import ragas`.
groundedness = [
    "ragas==0.4.3",
    "langchain-community<0.4",
    "openai>=1.30.0",
]

[project.scripts]
jeval = "jarvis_eval.cli:main"

[tool.setuptools]
packages = ["jarvis_eval", "jarvis_eval.clients", "jarvis_eval.benchmarks"]
